[project]
name = "github-repo-analyzer"
version = "0.2.0"
description = "A CLI tool to fetch and display the 10 top repositories of a Github account using GitHub API"
authors = [
    {name = "TMat24Git",email = "mathilde.thery@etu.emse.fr"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "rich (>=15.0.0,<16.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include ="src"}]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true

[dependency-groups]
dev = [
    "ruff (>=0.17.6,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "types-requests (>=2.33.0.20261030,<3.0.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]
